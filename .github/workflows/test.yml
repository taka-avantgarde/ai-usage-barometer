name: test
on:
  push:
  pull_request:
jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n ai-usage.60s.sh install.sh uninstall.sh claude-usage.sh codex-usage.sh claude-statusline-capture.sh configure-claude-statusline.sh tests/run.sh
      - name: Tests
        run: ./tests/run.sh
