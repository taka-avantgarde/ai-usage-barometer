<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Usage Barometer settings</title>
  <style>
    :root { color-scheme: light dark; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: Canvas; color: CanvasText; }
    h1 { margin: 0 0 16px; font-size: 20px; }
    section { margin: 0 0 18px; padding: 14px; border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 12px; }
    h2 { margin: 0 0 9px; font-size: 13px; color: #6e6e73; }
    label { display: flex; align-items: center; gap: 9px; min-height: 34px; }
    label.child { padding-left: 24px; }
    label.muted { color: #8e8e93; opacity: .68; }
    input { width: 17px; height: 17px; accent-color: #1a8ba6; }
    .radios { display: flex; gap: 17px; }
    .radios label { min-height: 28px; }
    .status { min-height: 18px; margin-top: 8px; color: #6e6e73; font-size: 12px; }
    .update { display: none; margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, #ff9f0a 16%, Canvas); border: 1px solid color-mix(in srgb, #ff9f0a 45%, transparent); }
    .update.visible { display: block; }
    .update-title { margin-bottom: 8px; font-weight: 650; }
    .update-actions { display: flex; gap: 8px; }
    .update a, .update button { padding: 6px 10px; border: 0; border-radius: 7px; background: #1a8ba6; color: white; font: inherit; text-decoration: none; cursor: pointer; }
    .update a { background: #6e6e73; }
  </style>
</head>
<body>
  <h1 id="title">Display settings</h1>
  <div id="update" class="update">
    <div id="update-title" class="update-title"></div>
    <div class="update-actions">
      <a href="https://github.com/taka-avantgarde/ai-usage-barometer/releases/latest" target="_blank">Release notes</a>
      <button id="install-update" type="button">Update now</button>
    </div>
  </div>
  <section>
    <h2>Claude</h2>
    <label><input id="claude_on" type="checkbox"> <span>Show Claude</span></label>
    <label class="child claude-child"><input id="c5" type="checkbox"> <span>Show Claude 5h</span></label>
    <label class="child claude-child"><input id="c5p" type="checkbox"> <span>Claude 5h percentage</span></label>
    <label class="child claude-child"><input id="c7" type="checkbox"> <span>Show Claude 7d</span></label>
    <label class="child claude-child"><input id="c7p" type="checkbox"> <span>Claude 7d percentage</span></label>
  </section>
  <section>
    <h2>Codex</h2>
    <label><input id="codex_on" type="checkbox"> <span>Show Codex</span></label>
    <label class="child codex-child"><input id="cx5" type="checkbox"> <span>Show Codex 5h</span></label>
    <label class="child codex-child"><input id="cx5p" type="checkbox"> <span>Codex 5h percentage</span></label>
    <label class="child codex-child"><input id="cx7" type="checkbox"> <span>Show Codex 7d</span></label>
    <label class="child codex-child"><input id="cx7p" type="checkbox"> <span>Codex 7d percentage</span></label>
  </section>
  <section>
    <h2>Refresh interval (minutes)</h2>
    <div class="radios">
      <label><input name="iv" type="radio" value="1">1</label>
      <label><input name="iv" type="radio" value="3">3</label>
      <label><input name="iv" type="radio" value="5">5</label>
    </div>
  </section>
  <div id="status" class="status" aria-live="polite"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const toggleIds = ['claude_on', 'c5', 'c5p', 'c7', 'c7p', 'codex_on', 'cx5', 'cx5p', 'cx7', 'cx7p'];
    function muteChildren(service) {
      const on = document.querySelector(`#${service}_on`).checked;
      document.querySelectorAll(`.${service}-child`).forEach(label => {
        label.classList.toggle('muted', !on);
        label.querySelector('input').disabled = !on;
      });
    }

    function save(key, value) {
      params.set(key, value);
      document.querySelector('#status').textContent = 'Saved';
      location.href = `swiftbar://refreshplugin?name=claude-codex.60s.sh&AUB_KEY=${encodeURIComponent(key)}&AUB_VALUE=${encodeURIComponent(value)}`;
    }

    toggleIds.forEach(id => {
      const input = document.querySelector(`#${id}`);
      input.checked = params.get(id) !== '0';
      input.addEventListener('change', () => {
        if (id === 'claude_on') muteChildren('claude');
        if (id === 'codex_on') muteChildren('codex');
        save(id, input.checked ? '1' : '0');
      });
    });
    document.querySelectorAll('input[name="iv"]').forEach(input => {
      input.checked = input.value === (params.get('iv') || '3');
      input.addEventListener('change', () => save('iv', input.value));
    });
    const updateVersion = params.get('update');
    document.querySelector('#update').classList.toggle('visible', Boolean(updateVersion));
    if (updateVersion) {
      document.querySelector('#update-title').textContent = `Update ${updateVersion} is available`;
    }
    document.querySelector('#install-update').addEventListener('click', () => {
      location.href = 'swiftbar://refreshplugin?name=claude-codex.60s.sh&AUB_ACTION=update';
    });
    muteChildren('claude');
    muteChildren('codex');
  </script>
</body>
</html>
